{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedRegistry{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="{% url 'home' %}">MedRegistry</a>
      <nav class="nav">
        <a href="{% url 'home' %}">Обзор</a>
        <a href="{% url 'patient_list' %}">Пациенты</a>
        <a href="{% url 'immunization_journal' %}">Иммунизация</a>
        <a href="/api/" target="_blank" rel="noopener">API</a>
        <a href="/admin/" target="_blank" rel="noopener">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer wrap">
    <p>MedRegistry · Django + DRF</p>
  </footer>
</body>
</html>
